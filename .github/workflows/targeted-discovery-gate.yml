name: Targeted Discovery Pre-Merge Gate

on:
  push:
    branches:
      - test/6.7.0-targeted-discovery

permissions:
  contents: read

jobs:
  localtuya-target:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hardware lab
        uses: actions/checkout@v4
        with:
          path: hardware-lab

      - name: Checkout exact LocalTuya candidate
        uses: actions/checkout@v4
        with:
          repository: MattiaFontana997/localtuya
          ref: 4ad4c0bd2a68599c59d40167bdf6468b599b8220
          path: localtuya

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install hardware lab dependencies
        run: python -m pip install -e hardware-lab

      - name: Install Home Assistant and LocalTuya onboarding runtime
        run: >-
          python -m pip install
          "homeassistant==2026.9.0"
          "tuya-device-sharing-sdk~=0.2.4"

      - name: Record exact LocalTuya SHA
        run: git -C localtuya rev-parse HEAD

      - name: Run full virtual hardware certification
        env:
          LOCALTUYA_ROOT: ${{ github.workspace }}/localtuya
        run: python -m unittest discover -s hardware-lab/tests -v
