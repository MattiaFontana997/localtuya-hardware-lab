name: Apply Add Device Finish Gate Fix

on:
  push:
    branches: [develop]
    paths:
      - scripts/_fix_finish_gate.py
      - .github/workflows/apply-finish-gate-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Apply test fix
        run: python scripts/_fix_finish_gate.py
      - name: Syntax and diff checks
        run: |
          python -m compileall -q tests
          git diff --check
      - name: Commit final test changes and self-delete
        run: |
          rm -f scripts/_fix_finish_gate.py .github/workflows/apply-finish-gate-fix.yml
          git add tests/test_localtuya_add_device.py tests/test_onboarding_hardware_paths.py scripts/_fix_finish_gate.py .github/workflows/apply-finish-gate-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix real Add Device finish certification flow"
          git push origin HEAD:develop
