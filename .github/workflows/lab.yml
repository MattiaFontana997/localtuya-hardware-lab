name: LocalTuya Virtual Hardware Lab

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      localtuya_ref:
        description: LocalTuya branch, tag or SHA to certify
        required: false
        default: develop

permissions:
  contents: read

concurrency:
  group: hardware-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install hardware lab
        run: python -m pip install -e .
      - name: Test independent lab harness
        run: python -m unittest discover -s tests -v

  localtuya-target:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hardware lab
        uses: actions/checkout@v4
        with:
          path: hardware-lab
      - name: Checkout LocalTuya target
        uses: actions/checkout@v4
        with:
          repository: MattiaFontana997/localtuya
          ref: ${{ github.event.inputs.localtuya_ref || 'develop' }}
          path: localtuya
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install hardware lab dependencies
        run: python -m pip install -e hardware-lab
      - name: Install Home Assistant target runtime
        run: python -m pip install "homeassistant==2026.9.0"
      - name: Record exact LocalTuya SHA
        run: git -C localtuya rev-parse HEAD | tee hardware-lab/reports/localtuya-sha.txt
      - name: Test real LocalTuya transport and onboarding against virtual devices
        env:
          LOCALTUYA_ROOT: ${{ github.workspace }}/localtuya
        run: python -m unittest discover -s hardware-lab/tests -v
      - name: Write certification report
        working-directory: hardware-lab
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/write_certification.py
      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localtuya-hardware-lab-certification
          if-no-files-found: warn
          path: |
            hardware-lab/reports/localtuya-sha.txt
            hardware-lab/reports/certification.json
            hardware-lab/scenarios/*.json
