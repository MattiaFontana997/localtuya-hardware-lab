[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "localtuya-hardware-lab"
version = "0.2.0"
description = "Independent virtual hardware certification lab for LocalTuya"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46",
]

[tool.setuptools.packages.find]
where = ["src"]
